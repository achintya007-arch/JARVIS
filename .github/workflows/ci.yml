name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    # Project sources live in the jarvis_v1/ subdirectory of the repo.
    working-directory: jarvis_v1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Lightweight install: the portable unit + security tests need only
        # these. The heavy ML/audio stack (chromadb, faster-whisper, torch,
        # sounddevice) is not required to exercise routing, state, and the
        # AgentExecutor security policy (desktop deps are import-guarded).
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 pytest-asyncio==0.25.2 ruff==0.9.2 \
                      PyYAML==6.0.3 psutil==7.2.2 httpx==0.28.1 aiosqlite==0.22.1

      - name: Lint (ruff)
        # Non-blocking for now — surfaces issues without failing the build
        # while the legacy V1/V2 code is cleaned up incrementally.
        continue-on-error: true
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v
