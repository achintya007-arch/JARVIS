name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    # Project sources live in the jarvis_v1/ subdirectory of the repo.
    working-directory: jarvis_v1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Lightweight install: the portable unit + security tests need only
        # these. The heavy ML/audio stack (chromadb, faster-whisper, torch,
        # sounddevice) is not required to exercise routing, state, the voice
        # state machine, and the AgentExecutor security policy — heavy deps are
        # imported lazily or the tests that need them importorskip.
        # numpy: voice/endpoint tests. websockets + jsonschema: the Brain–Body
        # Protocol server and its schema contract tests.
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 pytest-asyncio==0.25.2 ruff==0.9.2 \
                      PyYAML==6.0.3 psutil==7.2.2 httpx==0.28.1 aiosqlite==0.22.1 \
                      numpy==1.26.4 websockets==16.1.1 jsonschema==4.26.0

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

  body:
    # The C# Body (WPF HUD + Bbp.Client). WPF needs a Windows runner; the
    # client tests validate against the same protocol/ schemas as the Brain.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: body
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build Jarvis.Body.sln -c Release

      - name: Test
        run: dotnet test Jarvis.Body.sln -c Release --no-build --logger "console;verbosity=normal"
